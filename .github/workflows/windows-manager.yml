name: Verify GOATS Windows Manager V5.4.15.5

on:
  workflow_dispatch:
  push:
    branches: [main, codex/windows-fullscreen-analysis]
    paths:
      - 'windows/v5.4.15.5-burst4/**'
      - 'tests/windows_fullscreen/**'
      - '.github/workflows/windows-manager.yml'
  pull_request:
    paths:
      - 'windows/v5.4.15.5-burst4/**'
      - 'tests/windows_fullscreen/**'
      - '.github/workflows/windows-manager.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve release file bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install application and browser test dependencies
        run: python -m pip install -r windows/v5.4.15.5-burst4/requirements.txt playwright
      - name: Install Chromium for map tests
        run: python -m playwright install chromium
      - name: Check Python syntax
        run: python -m compileall -q windows/v5.4.15.5-burst4
      - name: Verify package checksums
        working-directory: windows/v5.4.15.5-burst4
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          for line in Path('SHA256SUMS.txt').read_text().splitlines():
              expected, name = line.split('  ', 1)
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected, name
      - name: Test fullscreen controls and map
        run: python tests/windows_fullscreen/test_fullscreen.py
      - name: Package tested Windows project
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root = Path('windows/v5.4.15.5-burst4')
          names = [line.split('  ', 1)[1] for line in (root / 'SHA256SUMS.txt').read_text().splitlines()]
          names.append('SHA256SUMS.txt')
          with zipfile.ZipFile('GOATS_RT_Manager_V5.4.15.5_FULLSCREEN.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(root / name, 'GOATS_RT_Manager_V5.4.15.5/' + name)
      - uses: actions/upload-artifact@v4
        with:
          name: GOATS-RT-Manager-Windows-V5.4.15.5
          path: GOATS_RT_Manager_V5.4.15.5_FULLSCREEN.zip
          if-no-files-found: error
