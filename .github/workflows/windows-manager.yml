name: Verify GOATS Windows Manager V5.4.15.10

on:
  workflow_dispatch:
  push:
    branches: [main, codex/replay-fast-speeds]
    paths:
      - 'windows/v5.4.15.10-burst4/**'
      - 'tests/windows_fullscreen/**'
      - 'tests/cloud_gnss/**'
      - 'tests/session_lifecycle/**'
      - 'tests/gnss_persistence/**'
      - 'mobile/v0.2.3/fullapp/src/main/python/goats_cloud_sync.py'
      - '.github/workflows/windows-manager.yml'
  pull_request:
    paths:
      - 'windows/v5.4.15.10-burst4/**'
      - 'tests/windows_fullscreen/**'
      - 'tests/cloud_gnss/**'
      - 'tests/session_lifecycle/**'
      - 'tests/gnss_persistence/**'
      - 'mobile/v0.2.3/fullapp/src/main/python/goats_cloud_sync.py'
      - '.github/workflows/windows-manager.yml'

permissions:
  contents: read

jobs:
  verify:
    env:
      GOATS_WINDOWS_VERSION: '5.4.15.10'
      GOATS_MOBILE_VERSION: '0.2.3'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve release file bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install application and browser test dependencies
        run: python -m pip install -r windows/v5.4.15.10-burst4/requirements.txt playwright
      - name: Install Chromium for map tests
        run: python -m playwright install chromium
      - name: Check Python syntax
        run: python -m compileall -q windows/v5.4.15.10-burst4
      - name: Verify package checksums
        working-directory: windows/v5.4.15.10-burst4
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          for line in Path('SHA256SUMS.txt').read_text().splitlines():
              expected, name = line.split('  ', 1)
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == expected, name
      - name: Test shared cloud sync and GNSS profiles
        run: |
          python tests/cloud_gnss/test_cloud_sync.py
          python tests/cloud_gnss/test_gnss.py
          python tests/cloud_gnss/test_windows_ui.py
          python tests/session_lifecycle/test_session_files.py
          python tests/session_lifecycle/test_windows_flow.py
      - name: Test GNSS flash persistence and rate readback
        run: |
          python tests/gnss_persistence/test_storage.py
          python tests/gnss_persistence/test_ui.py
      - name: Test fullscreen controls and map
        env:
          GOATS_WINDOWS_VERSION: '5.4.15.10'
        run: python tests/windows_fullscreen/test_fullscreen.py
      - name: Package tested Windows project
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root = Path('windows/v5.4.15.10-burst4')
          names = [line.split('  ', 1)[1] for line in (root / 'SHA256SUMS.txt').read_text().splitlines()]
          names.append('SHA256SUMS.txt')
          with zipfile.ZipFile('GOATS_RT_Manager_V5.4.15.10_FAST_REPLAY.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  archive.write(root / name, 'GOATS_RT_Manager_V5.4.15.10/' + name)
      - uses: actions/upload-artifact@v4
        with:
          name: GOATS-RT-Manager-Windows-V5.4.15.10
          path: GOATS_RT_Manager_V5.4.15.10_FAST_REPLAY.zip
          if-no-files-found: error
