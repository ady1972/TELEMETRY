name: Build GOATS Mobile Android V0.2.3

on:
  workflow_dispatch:
  push:
    branches: [main, codex/session-file-lifecycle]
    paths:
      - 'mobile/**'
      - 'windows/**/sample_test.grt'
      - 'tests/mobile_windows/**'
      - 'tests/cloud_gnss/**'
      - 'tests/session_lifecycle/**'
      - 'windows/v5.4.15.7-burst4/goats_cloud_sync.py'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'windows/**/sample_test.grt'
      - 'tests/mobile_windows/**'
      - 'tests/cloud_gnss/**'
      - 'tests/session_lifecycle/**'
      - 'windows/v5.4.15.7-burst4/goats_cloud_sync.py'
      - '.github/workflows/mobile-android.yml'

permissions:
  contents: read

jobs:
  build:
    env:
      GOATS_WINDOWS_VERSION: '5.4.15.7'
      GOATS_MOBILE_VERSION: '0.2.3'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/v0.2.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Python engine
        working-directory: .
        run: python tests/mobile_windows/verify_import.py mobile
      - name: Verify shared sync engine and Android bridge
        working-directory: .
        run: |
          python tests/cloud_gnss/test_cloud_sync.py
          python tests/cloud_gnss/test_mobile_bridge.py
          python tests/session_lifecycle/test_mobile_deletions.py
          python tests/session_lifecycle/test_session_files.py
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GOATS-RT-Manager-Android-V0.2.3-debug
          path: mobile/v0.2.3/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
