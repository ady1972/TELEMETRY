name: Build GOATS Mobile Android V0.2.1

on:
  workflow_dispatch:
  push:
    branches: [codex/mobile-windows-handoff]
    paths:
      - 'mobile/**'
      - 'windows/**/sample_test.grt'
      - 'tests/mobile_windows/**'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'windows/**/sample_test.grt'
      - 'tests/mobile_windows/**'
      - '.github/workflows/mobile-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/v0.2.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Python engine
        working-directory: .
        run: python tests/mobile_windows/verify_import.py mobile
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GOATS-RT-Manager-Android-V0.2.1-debug
          path: mobile/v0.2.1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
