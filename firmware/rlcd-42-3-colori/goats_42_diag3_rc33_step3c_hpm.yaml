esphome:
  name: goats-rc33-step3c-hpm
  friendly_name: GOATS RC3.3 STEP3C HPM
  comment: "STEP3C: LCD HPM 51Hz nominali, invio STEP3B a 8fps massimi, GPS/telemetria STEP3"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  partitions:
    - name: goatsfs
      type: data
      subtype: spiffs
      size: 0x200000
  framework:
    type: arduino

logger:
  level: INFO
  baud_rate: 0

uart:
  - id: gps_uart
    rx_pin: GPIO1      # MG902 TX -> ESP RX
    tx_pin: GPIO2      # MG902 RX <- ESP TX
    baud_rate: 38400  # profilo RLCD, bootstrap a 230400 in RAM
    rx_buffer_size: 16384

external_components:
  - source:
      type: local
      path: GOATS_DIAG3_RC33_STEP3C_HPM/components
    components: [goats_spi_diag]

goats_spi_diag:
  id: goats_controller
  gps_uart_id: gps_uart
  lcd_data_swap: true    # DTFORM 0x01, XDE attivo per MY=1; false ripristina STEP3
  fast_display: true    # invio ogni 125ms, senza attese da 16ms fra i blocchi
  lcd_high_power: true  # HPM 51Hz nominali; false ripristina LPM STEP3B
  alignment_test: false
  start_in_diagnostics: false
  delta_screen: false
  font_13: f13
  font_16: f16
  font_20: f20
  font_28: f28
  font_36: f36
  font_42: f42
  font_44: f44
  font_52: f52
  font_60: f60
  font_64: f64
  font_72: f72
  font_78: f78
  font_82: f82


font:
