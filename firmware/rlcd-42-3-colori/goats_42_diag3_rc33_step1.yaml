esphome:
  name: goats-diag3-rc33-step1
  friendly_name: GOATS DIAG3 RC3.3 STEP1
  comment: "DIAG3 confermata con motore RC3.3 in RAM, nessun nuovo avvio USB/SD o cambio UART"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  partitions:
    - name: goatsfs
      type: data
      subtype: spiffs
      size: 0x200000
  framework:
    type: arduino

logger:
  level: INFO
  baud_rate: 0

uart:
  - id: gps_uart
    rx_pin: GPIO1      # MG902 TX -> ESP RX
    tx_pin: GPIO2      # MG902 RX <- ESP TX
    baud_rate: 38400  # profilo RLCD, bootstrap a 230400 in RAM
    rx_buffer_size: 16384

external_components:
  - source:
      type: local
      path: GOATS_DIAG3_RC33_STEP1/components
    components: [goats_spi_diag]

goats_spi_diag:
  id: goats_controller
  gps_uart_id: gps_uart

# ST7306: CS10 DC9 RST8 MOSI11 CLK12, SPI 4 MHz, TE scollegato.
# Tasti INPUT_PULLUP: UP4 DOWN5 BACK6 OK7, chiusura verso GND.
# Sessioni: NVS interno, salvate per giro. NO export CSV in questa RC.
