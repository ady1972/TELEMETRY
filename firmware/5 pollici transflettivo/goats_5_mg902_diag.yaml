# =====================================================================
#  Diagnostica telemetria GPS
#  Scheda : VIEWE UEDX80480050E-WB-B (ESP32-S3, 16 MB flash, 8 MB PSRAM)
#  Display: LCM-UEED050WV-RB40-L001 (5" 800x480 RGB, transflettivo)
#  GPS    : MG902 gia' configurato: 230400 baud, solo UBX, 25 Hz
# =====================================================================

substitutions:
  # --- Collegamento GPS (header sinistro della scheda) ---
  gps_rx_pin: GPIO17   # ingresso ESP  <-- TX del GPS   (obbligatorio)
  gps_baud: "230400"
  gps_rate: "25"       # Hz attesi
  gps_poll: "false"     # "false" = ascolto puro, nessun byte inviato al modulo
  # --- Pixel clock LCD (vedi README, sezione "Display") ---
  pclk: 32.4MHz
  auto_pages: "true"   # cambia pagina ogni 10 s, anche senza touch
  device_name: goats-5-mg902-diag

esphome:
  name: ${device_name}
  friendly_name: GOATS 5 MG902 DIAG-R1
  project:
    name: goats.mg902_diag
    version: "0.1.0"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: 50%
      - lvgl.resume:
      - lvgl.page.show: page_fix

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: "y"
    advanced:
      execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

# La USB "UART" della scheda passa da un CH340C su UART0.
# La USB nativa dell'ESP32-S3 usa GPIO19/20, che qui sono riservati al touch.
logger:
  hardware_uart: UART0
  level: INFO

# Nessun Wi-Fi/OTA: diagnostica via USB UART0.

external_components:
  - source:
      type: local
      path: GOATS_5_MG902_DIAG_V010/components

# RX passivo: nessuna configurazione o richiesta inviata al ricevitore.
uart:
  - id: gps_uart
    rx_pin: ${gps_rx_pin}
    baud_rate: ${gps_baud}
    rx_buffer_size: 8192

ubx_diag:
  id: gnss
  uart_id: gps_uart
  poll: ${gps_poll}
  expected_rate: ${gps_rate}
  expected_baud: ${gps_baud}

# ---------------------------------------------------------------------
#  Retroilluminazione (GPIO2 -> PWM del driver LP3310)
# ---------------------------------------------------------------------
output:
  - platform: ledc
    id: bl_pwm
    pin: GPIO2
    frequency: 1000Hz

light:
  - platform: monochromatic
    name: "Retroilluminazione"
    id: backlight
    output: bl_pwm
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------
#  Display RGB565 parallelo
# ---------------------------------------------------------------------
display:
  - platform: mipi_rgb
    id: lcd
    model: RPI
    dimensions:
      width: 800
      height: 480
    color_order: RGB
    pclk_frequency: ${pclk}
    pclk_inverted: true
    # Profilo gia' usato sul 5 pollici: totale 1000 x 540, 60 Hz
    hsync_pulse_width: 24
    hsync_back_porch: 136
    hsync_front_porch: 40
    vsync_pulse_width: 2
    vsync_back_porch: 21
    vsync_front_porch: 37
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    data_pins:
      red: [45, 48, 47, 21, 14]        # R3..R7 del pannello
      green: [5, 6, 7, 15, 16, 4]      # G2..G7
      blue: [8, 3, 46, 9, 1]           # B3..B7
    auto_clear_enabled: false
    update_interval: never

# ---------------------------------------------------------------------
#  Tasto BOOT: breve = pagina successiva, lungo (>1 s) = azzera statistiche
# ---------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    name: "Tasto BOOT"
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      - min_length: 30ms
        max_length: 800ms
        then:
          - lvgl.page.next:
      - min_length: 1000ms
        max_length: 8000ms
        then:
          - lambda: id(gnss).reset_statistics();

button:
  - platform: template
    name: "Azzera statistiche"
    on_press:
      - lambda: id(gnss).reset_statistics();
  - platform: restart
    name: "Riavvia"

sensor:
  - platform: template
    name: "GPS rate NAV-PVT"
    unit_of_measurement: "Hz"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: return id(gnss).pvt_rate();
  - platform: template
    name: "GPS satelliti usati"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(gnss).sv_used();
  - platform: template
    name: "GPS accuratezza orizzontale"
    unit_of_measurement: "m"
    accuracy_decimals: 2
    update_interval: 1s
    lambda: return id(gnss).h_acc_m();
  - platform: template
    name: "GPS velocita"
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: return id(gnss).speed_kmh();
  - platform: template
    name: "GPS epoche perse"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(gnss).lost_epochs();
  - platform: template
    name: "GPS errori checksum"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(gnss).checksum_errors();

text_sensor:
  - platform: template
    name: "GPS fix"
    update_interval: 1s
    lambda: return id(gnss).fix_text();
  - platform: template
    name: "GPS collegamento"
    update_interval: 1s
    lambda: return id(gnss).link_text();

# ---------------------------------------------------------------------
#  Aggiornamento schermo: solo la pagina visibile
# ---------------------------------------------------------------------
interval:
  - interval: 250ms
    then:
      - lvgl.label.update:
          id: lbl_header
          text: !lambda return id(gnss).header_text();
      - lvgl.label.update:
          id: lbl_link
          text: !lambda return id(gnss).link_text();
          text_color: !lambda |-
            const int l = id(gnss).link_level();
            return lv_color_hex(l == 0 ? 0x006000 : (l == 1 ? 0x9A4D00 : 0xB00000));
      - if:
          condition:
            lvgl.page.is_showing: page_fix
          then:
            - lvgl.label.update:
                id: lbl_fix_type
                text: !lambda return id(gnss).fix_text();
                text_color: !lambda |-
                  const int l = id(gnss).fix_level();
                  return lv_color_hex(l == 0 ? 0x006000 : (l == 1 ? 0x9A4D00 : 0xB00000));
            - lvgl.label.update:
                id: lbl_speed
                text: !lambda return id(gnss).speed_text();
            - lvgl.label.update:
                id: lbl_sv
                text: !lambda return id(gnss).sv_text();
            - lvgl.label.update:
                id: lbl_pos
                text: !lambda return id(gnss).fix_position_text();
            - lvgl.label.update:
                id: lbl_qual
                text: !lambda return id(gnss).fix_quality_text();
      - if:
          condition:
            lvgl.page.is_showing: page_link
          then:
            - lvgl.label.update:
                id: lbl_stats
                text: !lambda return id(gnss).link_stats_text();
            - lvgl.label.update:
                id: lbl_msgs
                text: !lambda return id(gnss).link_messages_text();
      - if:
          condition:
            lvgl.page.is_showing: page_sat
          then:
            - lvgl.label.update:
                id: lbl_sat_sum
                text: !lambda return id(gnss).sat_summary_text();
            - lvgl.label.update:
                id: lbl_sat_a
                text: !lambda return id(gnss).sat_list_text(0);
            - lvgl.label.update:
                id: lbl_sat_b
                text: !lambda return id(gnss).sat_list_text(1);
      - if:
          condition:
            lvgl.page.is_showing: page_cfg
          then:
            - lvgl.label.update:
                id: lbl_cfg
                text: !lambda return id(gnss).config_text();
            - lvgl.label.update:
                id: lbl_module
                text: !lambda return id(gnss).module_text();
      - if:
          condition:
            lvgl.page.is_showing: page_sys
          then:
            - lvgl.label.update:
                id: lbl_sys
                text: !lambda return id(gnss).system_text();
            - lvgl.label.update:
                id: lbl_render
                text: !lambda |-
                  std::string s = "DISPLAY DIAG-R1\n";
                  ubx::appendf(s, "Disegni  %u\nEta'     %u ms\nMax draw %u ms\nRiprese  %u\n",
                    (unsigned) id(draw_count), (unsigned) (millis() - id(last_draw_ms)),
                    (unsigned) id(max_draw_ms), (unsigned) id(resume_count));
                  s += id(ui).is_paused() ? "LVGL IN PAUSA\n" : "LVGL attivo\n";
                  s += "RGB 32.4 MHz / 60 Hz\nLuce 50% / Wi-Fi OFF";
                  return s;
  - interval: 10s
    then:
      - if:
          condition:
            lambda: return ${auto_pages};
          then:
            - lvgl.page.next:
      - if:
          condition:
            lambda: return id(ui).is_paused();
          then:
            - lambda: |-
                id(resume_count)++;
                ESP_LOGW("display_diag", "LVGL in pausa: ripresa del rendering");
            - lvgl.resume:
      - lambda: |-
          ESP_LOGI("display_diag", "DIAG-R1 | draw=%u age=%u ms max=%u ms resumes=%u paused=%d",
            (unsigned) id(draw_count), (unsigned) (millis() - id(last_draw_ms)),
            (unsigned) id(max_draw_ms), (unsigned) id(resume_count), id(ui).is_paused());
          ESP_LOGI("display_diag", "%s", id(gnss).system_text().c_str());

globals:
  - id: draw_count
    type: uint32_t
    initial_value: '0'
  - id: last_draw_ms
    type: uint32_t
    initial_value: '0'
  - id: draw_start_ms
    type: uint32_t
    initial_value: '0'
  - id: max_draw_ms
    type: uint32_t
    initial_value: '0'
  - id: resume_count
    type: uint32_t
    initial_value: '0'

font:
  - id: font_mono
    file:
      type: gfonts
      family: Roboto Mono
      weight: 700
    size: 18
    bpp: 4

# ---------------------------------------------------------------------
#  Interfaccia: sfondo bianco e testo nero per la lettura al sole
# ---------------------------------------------------------------------
lvgl:
  id: ui
  paused: false
  full_refresh: false
  refresh_interval: 33ms
  on_draw_start:
    - lambda: id(draw_start_ms) = millis();
  on_draw_end:
    - lambda: |-
        const uint32_t elapsed = millis() - id(draw_start_ms);
        if (elapsed > id(max_draw_ms)) id(max_draw_ms) = elapsed;
        id(last_draw_ms) = millis();
        id(draw_count)++;
  displays:
    - lcd
  buffer_size: 25%
  default_font: font_mono
  text_color: 0x000000
  top_layer:
    widgets:
      - label:
          id: lbl_header
          x: 8
          y: 4
          text: "GOATS MG902 DIAG-R1"
      - label:
          id: lbl_link
          x: 8
          y: 30
          text: "Avvio..."
      - label:
          x: 8
          y: 454
          text: "Pagina auto 10s | BOOT: pagina / lungo: azzera"
      - button:
          x: 700
          y: 442
          width: 92
          height: 34
          bg_color: 0x000000
          on_click:
            - lvgl.page.next:
          widgets:
            - label:
                align: CENTER
                text: "PAG >"
                text_color: 0xFFFFFF
  pages:
    - id: page_fix
      bg_color: 0xFFFFFF
      scrollable: false
      widgets:
        - label:
            id: lbl_fix_type
            x: 8
            y: 62
            text: "NO DATI"
            text_font: montserrat_28
        - label:
            id: lbl_speed
            x: 330
            y: 54
            text: "--.- km/h"
            text_font: montserrat_48
        - label:
            id: lbl_sv
            x: 650
            y: 54
            text: "Usati 0\nVisti --"
            text_font: montserrat_28
        - label:
            id: lbl_pos
            x: 8
            y: 118
            text: ""
        - label:
            id: lbl_qual
            x: 410
            y: 118
            text: ""
    - id: page_link
      bg_color: 0xFFFFFF
      scrollable: false
      widgets:
        - label:
            id: lbl_stats
            x: 8
            y: 62
            text: ""
        - label:
            id: lbl_msgs
            x: 400
            y: 62
            text: ""
    - id: page_sat
      bg_color: 0xFFFFFF
      scrollable: false
      widgets:
        - label:
            id: lbl_sat_sum
            x: 8
            y: 62
            text: ""
        - label:
            id: lbl_sat_a
            x: 400
            y: 62
            text: ""
        - label:
            id: lbl_sat_b
            x: 600
            y: 62
            text: ""
    - id: page_cfg
      bg_color: 0xFFFFFF
      scrollable: false
      widgets:
        - label:
            id: lbl_cfg
            x: 8
            y: 62
            text: ""
        - label:
            id: lbl_module
            x: 400
            y: 62
            text: ""
    - id: page_sys
      bg_color: 0xFFFFFF
      scrollable: false
      widgets:
        - label:
            id: lbl_sys
            x: 8
            y: 62
            text: ""
        - label:
            id: lbl_render
            x: 400
            y: 62
            text: ""
    - id: page_test
      bg_color: 0xFFFFFF
      scrollable: false
      widgets:
        - obj: {x: 0, y: 62, width: 100, height: 150, bg_color: 0xFFFFFF, bg_opa: COVER, border_width: 0, radius: 0, pad_all: 0, scrollable: false}
