# Progetto autonomo da zero. Nessun motore di cronometraggio ancora attivo.
substitutions:
  device_name: goats-5-transflettivo
  firmware_version: "0.1.0"

esphome:
  name: ${device_name}
  friendly_name: GOATS RT 5 pollici transflettivo
  project:
    name: goats_rt.transflettivo5
    version: ${firmware_version}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 50%
          transition_length: 0s

packages:
  hardware: !include GOATS_5_TRANSFLETTIVO_V010/config/board_viewe_b.yaml
  gnss: !include GOATS_5_TRANSFLETTIVO_V010/config/gnss_passivo.yaml
  gps_screen: !include GOATS_5_TRANSFLETTIVO_V010/config/display_800x480_gps.yaml

external_components:
  - source:
      type: local
      path: GOATS_5_TRANSFLETTIVO_V010/components
    components: [goats_core]

goats_core:
  id: goats_application
  uart_id: gnss_uart
  firmware_version: ${firmware_version}

# Nessun Wi-Fi, OTA, API di rete, touch o protocollo Manager in questo scaffold.
