  # V7.1 - Timer CHECK BENZINA.
  # Il conteggio parte sul fronte di inizio della sessione.
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool session_active = goats_sessions_active() && !goats_sessions_free_active();

          // Inizio sessione: azzera il conteggio e programma la prima scadenza.
          if (session_active && !id(fuel_session_was_active)) {
            id(fuel_session_start_ms) = now;
            id(fuel_alert_active) = false;
            id(fuel_alert_visible) = false;
            id(fuel_alert_start_ms) = 0;

            if (id(fuel_check_enabled)) {
              id(fuel_next_check_ms) =
                  now + static_cast<uint32_t>(
                    id(fuel_check_interval_min)) * 60000UL;
            } else {
              id(fuel_next_check_ms) = 0;
            }
          }

          // Fine sessione: annulla timer e avviso.
          if (!session_active && id(fuel_session_was_active)) {
            id(fuel_session_start_ms) = 0;
            id(fuel_next_check_ms) = 0;
            id(fuel_alert_active) = false;
            id(fuel_alert_visible) = false;
            id(fuel_alert_start_ms) = 0;
            lv_obj_add_flag(id(fuel_check_alert), LV_OBJ_FLAG_HIDDEN);
          }

          id(fuel_session_was_active) = session_active;

          if (!session_active || !id(fuel_check_enabled))
            return;

          // Avvia l'avviso alla scadenza programmata.
          if (!id(fuel_alert_active) &&
              id(fuel_next_check_ms) != 0 &&
              static_cast<int32_t>(now - id(fuel_next_check_ms)) >= 0) {
            id(fuel_alert_active) = true;
            id(fuel_alert_start_ms) = now;
            id(fuel_alert_visible) = true;
            lv_obj_clear_flag(id(fuel_check_alert), LV_OBJ_FLAG_HIDDEN);

            // Mantiene la cadenza ancorata all'inizio sessione.
            const uint32_t interval_ms =
                static_cast<uint32_t>(
                  id(fuel_check_interval_min)) * 60000UL;
            do {
              id(fuel_next_check_ms) += interval_ms;
            } while (static_cast<int32_t>(
                       now - id(fuel_next_check_ms)) >= 0);
          }

          if (!id(fuel_alert_active))
            return;

          const uint32_t alert_elapsed = now - id(fuel_alert_start_ms);

          // Dopo un minuto termina l'avviso.
          if (alert_elapsed >= 60000UL) {
            id(fuel_alert_active) = false;
            id(fuel_alert_visible) = false;
            lv_obj_add_flag(id(fuel_check_alert), LV_OBJ_FLAG_HIDDEN);
            return;
          }

          // Lampeggio: alterna ON/OFF ogni 3 secondi.
          const bool should_be_visible =
              ((alert_elapsed / 3000UL) % 2UL) == 0UL;

          if (should_be_visible != id(fuel_alert_visible)) {
            id(fuel_alert_visible) = should_be_visible;
            if (should_be_visible)
              lv_obj_clear_flag(id(fuel_check_alert), LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(id(fuel_check_alert), LV_OBJ_FLAG_HIDDEN);
          }

