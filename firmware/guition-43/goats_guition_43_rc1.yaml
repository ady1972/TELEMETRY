lvgl:
  displays:
    - my_display
  # V10.2.5C - Splash first: priorità grafica.
  # La logica firmware di inizializzazione resta invariata.
  on_boot:
    then:
      - lambda: |-
          const int index = id(selected_circuit);
          if (index <= 0 || static_cast<size_t>(index) > goats_track_count()) {
            id(selected_circuit) = 0;
            id(track_start_lat) = 0.0;
            id(track_start_lon) = 0.0;
            id(track_finish_lat) = 0.0;
            id(track_finish_lon) = 0.0;
            id(track_trigger_radius_m) = 20.0f;
          } else {
            const auto *track = goats_track(index - 1);
            if (track != nullptr) {
              id(track_start_lat) = track->start_lat;
              id(track_start_lon) = track->start_lon;
              id(track_finish_lat) = track->finish_lat;
              id(track_finish_lon) = track->finish_lon;
              id(track_trigger_radius_m) = track->trigger_radius_m;
            }
          }
