    type: bool
    restore_value: no
    initial_value: "false"

  - id: track_catalog_revision_seen
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: track_start_lat
    type: double
    restore_value: yes
    initial_value: "0.0"

  - id: track_start_lon
    type: double
    restore_value: yes
    initial_value: "0.0"

  - id: track_finish_lat
