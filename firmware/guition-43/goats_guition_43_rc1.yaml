# ============================================================
# V9.0 - MONITOR BATTERIA
# GPIO5 / coefficiente calibrazione 1.765
# Logica derivata dal test batteria validato sul dispositivo.
# ============================================================

sensor:
  - platform: adc
    pin: GPIO5
    id: battery_gpio5_adc
    attenuation: auto
    update_interval: 500ms
    accuracy_decimals: 3
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 15
          send_every: 3
          send_first_at: 1

  - platform: template
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: 500ms
    internal: true
    lambda: |-
      if (!id(battery_gpio5_adc).has_state()) return NAN;
      return id(battery_gpio5_adc).state * 1.765f;

  - platform: template
    id: battery_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1000ms
    internal: true
    lambda: |-
      if (!id(battery_voltage).has_state()) return NAN;

      const float sample = id(battery_voltage).state;
      if (!std::isfinite(sample) || sample < 2.8f || sample > 4.55f) return NAN;
      static float filtered = NAN;
      static float candidate = NAN;
      static uint8_t candidate_count = 0;
      if (!std::isfinite(filtered)) filtered = sample;
      if (fabsf(sample - filtered) > 0.22f) {
        if (!std::isfinite(candidate) || fabsf(candidate - sample) > 0.08f) {
          candidate = sample; candidate_count = 1;
        } else if (candidate_count < 255) ++candidate_count;
        if (candidate_count >= 4) {
          filtered = sample; candidate_count = 0; candidate = NAN;
        }
      } else {
        candidate_count = 0; candidate = NAN;
        filtered += 0.18f * (sample - filtered);
      }
      const float v = filtered;
      float p = 0.0f;

      if (v >= 4.20f)      p = 100.0f;
      else if (v >= 4.10f) p = 90.0f + (v - 4.10f) / 0.10f * 10.0f;
      else if (v >= 4.00f) p = 80.0f + (v - 4.00f) / 0.10f * 10.0f;
      else if (v >= 3.90f) p = 65.0f + (v - 3.90f) / 0.10f * 15.0f;
      else if (v >= 3.80f) p = 45.0f + (v - 3.80f) / 0.10f * 20.0f;
      else if (v >= 3.70f) p = 25.0f + (v - 3.70f) / 0.10f * 20.0f;
      else if (v >= 3.60f) p = 10.0f + (v - 3.60f) / 0.10f * 15.0f;
      else if (v >= 3.50f) p = 3.0f + (v - 3.50f) / 0.10f * 7.0f;
      else if (v >= 3.30f) p = (v - 3.30f) / 0.20f * 3.0f;
      else                 p = 0.0f;

      if (p < 0.0f) p = 0.0f;
      if (p > 100.0f) p = 100.0f;
      return p;


