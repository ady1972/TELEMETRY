    restore_value: yes
    initial_value: "5"

  - id: best_popup_hide_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # Stato precedente della sessione, usato per rilevarne l'inizio.
  - id: fuel_session_was_active
    type: bool
    restore_value: no
    initial_value: "false"

  # Istante di inizio della sessione.
  - id: fuel_session_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # Scadenza del prossimo controllo benzina.
  - id: fuel_next_check_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # Avviso attualmente in corso.
  - id: fuel_alert_active
    type: bool
    restore_value: no
    initial_value: "false"

  # Istante di avvio dell'avviso corrente.
  - id: fuel_alert_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # Stato visibile/non visibile del lampeggio.
  - id: fuel_alert_visible
    type: bool
    restore_value: no
    initial_value: "false"

  # Indice della sessione reale aperta nell'elenco (1..4).
  - id: selected_archive_session
