    type: int
    restore_value: yes
    initial_value: "0"

  # true = selezione automatica in base alla posizione GPS.
  - id: auto_track_selection
    type: bool
    restore_value: no
    initial_value: "true"

  # Stato del pannello di selezione circuiti.
  - id: track_menu_open
