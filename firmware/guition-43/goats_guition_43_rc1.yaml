# ============================================================
# UART GPS - UBX SOLO RICEZIONE 230400
# ============================================================

uart:
  - id: gps_uart
    rx_pin: GPIO17
    # TX GPIO18 disabilitato: UART solo RX, nessun comando verso il GNSS.
    baud_rate: 230400
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 4096

# ============================================================
# VARIABILI GPS
# ============================================================

globals:
  - id: detected_track_popup_hide_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: session_summary_visible
    type: bool
    restore_value: no
    initial_value: "false"

  - id: session_summary_hide_at_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # Luminosita display manuale, 10-100%.
  - id: display_brightness
    type: float
    restore_value: yes
    initial_value: "1.0"

  - id: usb_sd_mode_active
    type: bool
    restore_value: no
    initial_value: "false"

  # ============================================================
  # CHARGE MODE - rilevamento USB stimato dal monitor GPIO5.
  # Calibrato dai test: 3.80V -> 4.095V collegando USB,
  # 4.18V -> 4.30/4.36V collegando USB.
  # ============================================================
  - id: charge_usb_present
    type: bool
    restore_value: no
    initial_value: "false"
  - id: charge_baseline_v
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: charge_peak_v
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: charge_detect_since_ms
