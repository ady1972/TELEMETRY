    restore_value: no
    initial_value: "1"
  - id: pending_archive_delete_index
    type: int
    restore_value: no
    initial_value: "-1"


  # Indice circuito selezionato:
  # 0 = nessun circuito; 1..N = elemento del catalogo goats_tracks.h.
