   # V1.0.9 TEST: polling DBD disabilitato; nessuna trasmissione GNSS.

  # V11.0.2.40 - parser UBX nativo. NMEA non viene più usato.
  - interval: 5ms
    then:
      - lambda: |-
          uint8_t c;
          while (id(gps_uart).available()) {
            if (!id(gps_uart).read_byte(&c)) break;

            auto ck=[&](uint8_t v){
              id(gnss_ck_a)=uint8_t(id(gnss_ck_a)+v);
              id(gnss_ck_b)=uint8_t(id(gnss_ck_b)+id(gnss_ck_a));
            };

            switch(id(gnss_ubx_state)){
              case 0:
                if(c==0xB5) id(gnss_ubx_state)=1;
                break;
              case 1:
                if(c==0x62){
                  id(gnss_ubx_state)=2;
                  id(gnss_ck_a)=id(gnss_ck_b)=0;
                  id(gnss_payload).clear();
                } else id(gnss_ubx_state)=0;
                break;
              case 2:
                id(gnss_ubx_class)=c; ck(c); id(gnss_ubx_state)=3; break;
              case 3:
                id(gnss_ubx_id)=c; ck(c); id(gnss_ubx_state)=4; break;
              case 4:
                id(gnss_ubx_len)=c; ck(c); id(gnss_ubx_state)=5; break;
              case 5:
                id(gnss_ubx_len)|=uint16_t(c)<<8; ck(c); id(gnss_ubx_pos)=0;
                if(id(gnss_ubx_len)>1024) id(gnss_ubx_state)=0;
                else {
                  id(gnss_payload).reserve(id(gnss_ubx_len));
                  id(gnss_ubx_state)=id(gnss_ubx_len)?6:7;
                }
                break;
              case 6:
                id(gnss_payload).push_back(c); ck(c);
                if(++id(gnss_ubx_pos)>=id(gnss_ubx_len)) id(gnss_ubx_state)=7;
                break;
              case 7:
                id(gnss_rx_ck_a)=c; id(gnss_ubx_state)=8; break;
              case 8: {
                const bool ok =
                    id(gnss_rx_ck_a)==id(gnss_ck_a) && c==id(gnss_ck_b);

                if (id(gnss_ubx_class)==0x01 && id(gnss_ubx_id)==0x07)
                  goats_diag_v1021::increment(&goats_diag_v1021::Counters::pvt_received);
                if (!ok && id(gnss_ubx_class)==0x01 &&
                    id(gnss_ubx_id)==0x07)
                  goats_diag_v1021::increment(&goats_diag_v1021::Counters::pvt_bad_checksum);
                if(ok) {
                  const auto &p=id(gnss_payload);

                  // UBX-NAV-PVT: position, speed, heading, fix and numSV.
                  if(id(gnss_ubx_class)==0x01 &&
                     id(gnss_ubx_id)==0x07 && p.size()>=92) {
                    goats_diag_v1021::pvt_received(goats_ubx_v11::u4(p,0));
                    const uint8_t fix_type=p[20];
                    const uint8_t flags=p[21];
                    const bool fix_ok=(flags & 0x01u) != 0u && fix_type>=2;
                    if (fix_ok) goats_diag_v1021::increment(&goats_diag_v1021::Counters::pvt_fix_valid);
                    id(gps_fix)=fix_ok;
                    id(gps_satellites)=p[23]; // numSV used in navigation solution
                    id(gps_longitude)=goats_ubx_v11::i4(p,24)*1e-7;
                    id(gps_latitude)=goats_ubx_v11::i4(p,28)*1e-7;
                    id(gps_speed_kmh)=goats_ubx_v11::i4(p,60)*0.0036f;
                    id(gps_heading)=goats_ubx_v11::i4(p,64)*1e-5f;
                    goats_nav_queue::push(fix_ok && fix_type>=3 && p[23]>=4,
                        id(gps_latitude), id(gps_longitude), id(gps_speed_kmh),
                        millis(), goats_ubx_v11::u4(p,0), id(gps_hdop), p[23]);

                    // NAV-PVT is UTC. Convert to Europe/Rome:
                    // CET (UTC+1) / CEST (UTC+2), with automatic EU DST.
                    int year=(int) goats_ubx_v11::u2(p,4);
                    int month=(int)p[6], day=(int)p[7];
                    int hour=(int)p[8], minute=(int)p[9];
                    const uint8_t valid=p[11];
                    if((valid & 0x01u) && (valid & 0x02u) && year>=2020) {
                      auto leap=[](int yy)->bool {
                        return (yy%4==0 && yy%100!=0) || (yy%400==0);
                      };
                      auto dim=[&](int yy,int mm)->int {
                        static const int md[12]={31,28,31,30,31,30,31,31,30,31,30,31};
                        if(mm==2 && leap(yy)) return 29;
                        return md[mm-1];
                      };
                      // Gregorian weekday: 0=Sunday ... 6=Saturday.
                      auto weekday=[](int yy,int mm,int dd)->int {
                        if(mm<3){ mm+=12; yy--; }
                        int k=yy%100, j=yy/100;
                        int h=(dd + (13*(mm+1))/5 + k + k/4 + j/4 + 5*j)%7;
                        return (h+6)%7;
                      };
                      auto last_sunday=[&](int yy,int mm)->int {
                        int last=dim(yy,mm);
                        return last-weekday(yy,mm,last);
                      };

                      // EU DST boundaries are defined in UTC:
                      // last Sunday March 01:00 UTC -> last Sunday October 01:00 UTC.
                      bool dst=false;
                      if(month>3 && month<10) dst=true;
                      else if(month==3) {
                        int ls=last_sunday(year,3);
                        dst=(day>ls) || (day==ls && hour>=1);
                      } else if(month==10) {
                        int ls=last_sunday(year,10);
                        dst=(day<ls) || (day==ls && hour<1);
                      }

                      hour += dst ? 2 : 1;
                      if(hour>=24) {
                        hour-=24;
                        day++;
                        if(day>dim(year,month)) {
                          day=1; month++;
                          if(month>12) { month=1; year++; }
                        }
                      }

                      char d[16], tm[8];
                      snprintf(d,sizeof(d),"%02d/%02d/%04d",day,month,year);
                      snprintf(tm,sizeof(tm),"%02d:%02d",hour,minute);
                      id(gps_date_text)=d;
                      id(gps_time_text)=tm;
                    }

                    id(last_valid_rmc_ms)=millis();
                    id(rmc_counter)++; // retained variable: now counts NAV-PVT epochs
                  }

                  // UBX-NAV-DOP: true horizontal DOP, scale 0.01.
                  if(id(gnss_ubx_class)==0x01 &&
                     id(gnss_ubx_id)==0x04 && p.size()>=18) {
                    id(gps_hdop)=goats_ubx_v11::u2(p,12)*0.01f;
                  }

                  // UBX-NAV-SAT: numSvs = satellites currently reported/tracked.
                  if(id(gnss_ubx_class)==0x01 &&
                     id(gnss_ubx_id)==0x35 && p.size()>=8) {
                    id(gps_visible_satellites)=p[5];
                  }

                  // Existing DBD backup capture remains supported.
                  if(id(gnss_dbd_capture) &&
                     id(gnss_ubx_class)==0x13 &&
                     id(gnss_ubx_id)==0x80 &&
                     id(gnss_ubx_len)>=12 && id(gnss_ubx_len)<=164) {
                    std::vector<uint8_t> f={
                      0xB5,0x62,id(gnss_ubx_class),id(gnss_ubx_id),
                      uint8_t(id(gnss_ubx_len)),uint8_t(id(gnss_ubx_len)>>8)
                    };
                    f.insert(f.end(),p.begin(),p.end());
                    f.push_back(id(gnss_ck_a)); f.push_back(id(gnss_ck_b));
                    id(gnss_dbd_frames).push_back(f);
                  }
                  if(id(gnss_dbd_capture) &&
                     id(gnss_ubx_class)==0x13 &&
                     id(gnss_ubx_id)==0x60) {
                    std::vector<uint8_t> blob={'G','D','B','1'};
                    uint16_t n=id(gnss_dbd_frames).size();
                    blob.push_back(n); blob.push_back(n>>8);
                    for(auto &f:id(gnss_dbd_frames)){
                      uint16_t l=f.size();
                      blob.push_back(l); blob.push_back(l>>8);
                      blob.insert(blob.end(),f.begin(),f.end());
                    }
                    if(!id(gnss_dbd_frames).empty())
                      goats_gnss_assist::save_blob(blob);
                    id(gnss_dbd_capture)=false;
                    id(gnss_dbd_frames).clear();
                  }
                }
                id(gnss_ubx_state)=0;
                break;
              }
            }
          }

          if(id(gnss_dbd_capture) &&
             millis()-id(gnss_dbd_started)>8000UL) {
            id(gnss_dbd_capture)=false;
            id(gnss_dbd_frames).clear();
          }

          const GoatsTrackUsb *timing_track = nullptr;
          if (id(selected_circuit)>0 && static_cast<size_t>(id(selected_circuit))<=goats_track_count())
            timing_track=goats_track(id(selected_circuit)-1);
          goats_pipeline::drain(timing_track,
              id(gps_date_text).c_str(), id(gps_time_text).c_str());
          id(lap_delta_seconds)=goats_sessions_free_active() ? NAN :
              goats_laptimer_display_delta_seconds(millis());

  # Calcolo della frequenza UBX-NAV-PVT effettiva.
  - interval: 1s
    then:
      - lambda: |-
          uint32_t now_count = id(rmc_counter);
          id(rmc_hz) = static_cast<float>(now_count - id(last_rmc_counter));
          id(last_rmc_counter) = now_count;

          if (millis() - id(last_valid_rmc_ms) > 1500) {
            id(gps_fix) = false;
          }

  # Selezione automatica del circuito più vicino.
  # V11.0.2.40 AUTO TRACK FIX:
  # - usa direttamente il NAV-PVT UBX recente;
  # - controlla coordinate valide;
  # - considera finish-line + tutti i settori del circuito;
  # - AUTO torna attivo ad ogni riavvio.
  - interval: 200ms
    then:
      - lambda: |-
          if (id(track_menu_open) || !id(auto_track_selection) ||
              goats_track_count() == 0) return;

          // Non modificare il circuito durante una registrazione.
          // In precedenza AUTO TRACK poteva cambiare pista e poi chiamare
          // goats_sessions_reset_runtime(), interrompendo la sessione libera
          // e quindi bloccando il timer della pagina principale.
          if (goats_sessions_active() || goats_sessions_free_active()) return;

          // last_valid_rmc_ms mantiene il nome storico, ma in V11.0.2.40
          // viene aggiornato ad ogni UBX-NAV-PVT ricevuto.
          const uint32_t nav_age = millis() - id(last_valid_rmc_ms);
          const bool coord_ok =
              std::isfinite(id(gps_latitude)) &&
              std::isfinite(id(gps_longitude)) &&
              id(gps_latitude) >= -90.0 && id(gps_latitude) <= 90.0 &&
              id(gps_longitude) >= -180.0 && id(gps_longitude) <= 180.0 &&
              !(id(gps_latitude) == 0.0 && id(gps_longitude) == 0.0);

          if (!id(gps_fix) || nav_age > 3000U || !coord_ok) return;

          auto distance_m = [](double lat1, double lon1,
                               double lat2, double lon2) -> double {
            constexpr double PI = 3.14159265358979323846;
            constexpr double EARTH = 6371000.0;
            const double p1 = lat1 * PI / 180.0;
            const double p2 = lat2 * PI / 180.0;
            const double dp = (lat2 - lat1) * PI / 180.0;
            const double dl = (lon2 - lon1) * PI / 180.0;
            const double a = sin(dp/2)*sin(dp/2) +
                             cos(p1)*cos(p2)*sin(dl/2)*sin(dl/2);
            return 2.0 * EARTH * atan2(sqrt(a), sqrt(1.0-a));
          };

          constexpr double AUTO_TRACK_MAX_M = 5000.0;
          double best = AUTO_TRACK_MAX_M;
          int best_index = 0;

          auto consider = [&](double lat, double lon, size_t track_index) {
            const double d = distance_m(
                id(gps_latitude), id(gps_longitude), lat, lon);
            if (d < best) {
              best = d;
              best_index = static_cast<int>(track_index) + 1;
            }
          };

          for (size_t i = 0; i < goats_track_count(); i++) {
            const auto *track = goats_track(i);
            if (!track) continue;

            // Finish line: estremi + centro.
            consider(track->start_lat, track->start_lon, i);
            consider(track->finish_lat, track->finish_lon, i);
            consider((track->start_lat + track->finish_lat) * 0.5,
                     (track->start_lon + track->finish_lon) * 0.5, i);

            // Settori: estremi + centro. Questo rende la ricerca robusta
            // anche quando paddock/ingresso sono lontani dalla finish line.
            for (const auto &sector : track->sectors) {
              consider(sector.lat1, sector.lon1, i);
              consider(sector.lat2, sector.lon2, i);
              consider((sector.lat1 + sector.lat2) * 0.5,
                       (sector.lon1 + sector.lon2) * 0.5, i);
            }
          }

          if (best_index != id(selected_circuit)) {
            id(selected_circuit) = best_index;

            // Questo punto viene raggiunto solo a sessione inattiva.
            goats_laptimer_reset();
            goats_sessions_reset_runtime();

            if (best_index > 0) {
              const auto *track = goats_track(best_index - 1);
              if (track) {
                id(track_start_lat) = track->start_lat;
                id(track_start_lon) = track->start_lon;
                id(track_finish_lat) = track->finish_lat;
                id(track_finish_lon) = track->finish_lon;
                id(track_trigger_radius_m) = track->trigger_radius_m;

                lv_label_set_text(
                    id(lbl_detected_track_name),
                    goats_track_name(best_index - 1));
                lv_obj_clear_flag(
                    id(detected_track_popup), LV_OBJ_FLAG_HIDDEN);
                id(detected_track_popup_hide_at_ms) = millis() + 3000UL;
              }
            } else {
              lv_obj_add_flag(
                  id(detected_track_popup), LV_OBJ_FLAG_HIDDEN);
              id(detected_track_popup_hide_at_ms) = 0;
            }
          }
      # Aggiornamento SOLO al cambio effettivo del nome circuito.
      # Evita invalidazioni LVGL periodiche che causano sfarfallio.
      - lambda: |-
          static std::string previous_track_text;
          const int idx = id(selected_circuit);
          const std::string next_text =
              (idx > 0 && static_cast<size_t>(idx) <= goats_track_count())
              ? std::string(goats_track_name(idx - 1)) : std::string("AUTO");
          if (next_text != previous_track_text) {
            previous_track_text = next_text;
            lv_label_set_text(id(lbl_track), next_text.c_str());
            lv_obj_set_style_text_color(id(lbl_track),
                idx > 0 ? lv_color_hex(0x00D084) : lv_color_hex(0xFFB300),
                LV_PART_MAIN | LV_STATE_DEFAULT);
          }

  # Fine sessione automatica: solo GPS valido e veicolo fermo (<3 km/h).
  # Non termina per semplice perdita di fix e non interviene sulla sessione libera.
  - interval: 500ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (!id(auto_session_end_enabled) || !goats_sessions_active() ||
              goats_sessions_free_active() || !id(gps_fix) || !std::isfinite(id(gps_speed_kmh)) ||
              now - id(last_valid_rmc_ms) > 1500UL) {
            id(auto_session_stop_since_ms) = 0;
            return;
          }
          if (id(gps_speed_kmh) >= 3.0f) {
            id(auto_session_stop_since_ms) = 0;
            return;
          }
          if (id(auto_session_stop_since_ms) == 0) {
            id(auto_session_stop_since_ms) = now;
            return;
          }
          if (now - id(auto_session_stop_since_ms) >=
              static_cast<uint32_t>(id(auto_session_end_seconds)) * 1000UL) {
            goats_sessions_finish_manual(now);
            goats_laptimer_reset();
            id(auto_session_stop_since_ms) = 0;
            id(session_summary_visible) = true;
            id(session_summary_hide_at_ms) = now + 3000UL;
            lv_obj_clear_flag(id(session_summary_panel), LV_OBJ_FLAG_HIDDEN);
          }

  - interval: 1s
    then:
      - lambda: |-
          const std::string value = id(auto_session_end_enabled)
              ? std::to_string(id(auto_session_end_seconds)) + " s" : "OFF";
          lv_label_set_text(id(auto_session_setting_value), value.c_str());
          lv_label_set_text(id(auto_session_duration_label),
                            (std::to_string(id(auto_session_end_seconds)) + " s").c_str());

  # V11.0.2.40 - BARRE SETTORI sotto GIRO CORRENTE.
  # Stato:
  # 0 neutro; 1 fucsia = meglio del settore del Best Lap;
  # 2 rosso = peggio del giro precedente;
  # 3 verde = tra Best Lap e giro precedente.
  - interval: 100ms
    then:
      - lambda: |-
          lv_obj_t *bars[8] = {
            id(sector_bar_1), id(sector_bar_2), id(sector_bar_3),
            id(sector_bar_4), id(sector_bar_5), id(sector_bar_6),
            id(sector_bar_7), id(sector_bar_8)
          };

          // Layout 8: i tre settori visibili occupano tutta la larghezza (480 px).
          // Le barre 4..8 sono segnaposto legacy, sempre nascoste.
          for (size_t i = 0; i < 8; i++) {
            if (i >= 3) {
              lv_obj_add_flag(bars[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            lv_obj_clear_flag(bars[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(bars[i], static_cast<lv_coord_t>(i * 160));
            lv_obj_set_width(bars[i], 160);

            const int status = goats_laptimer_sector_display_status(i, millis());
            lv_color_t color = lv_color_hex(0x3A434D);  // neutro
            if (status == 1) color = lv_color_hex(0xFF00A8); // fucsia
            else if (status == 2) color = lv_color_hex(0xFFD600); // giallo intenso
            else if (status == 3) color = lv_color_hex(0x00FF00); // verde puro settori

            // Evita aggiornamenti grafici se il settore non cambia.
            static int last_sector_status[3] = {-1, -1, -1};
            static int last_sector_delta_ms[3] = {-2147483647, -2147483647, -2147483647};
            lv_obj_t *sector_labels[3] = {
              id(lbl_sector_1), id(lbl_sector_2), id(lbl_sector_3)
            };
            const float delta = goats_laptimer_sector_delta_best_seconds(i);
            const int delta_ms = isnan(delta) ? -2147483647 :
                                 static_cast<int>(lroundf(delta * 1000.0f));
            if (status != last_sector_status[i]) {
              lv_obj_set_style_bg_color(bars[i], color, LV_PART_MAIN | LV_STATE_DEFAULT);
              lv_obj_set_style_text_color(sector_labels[i],
                  status == 0 || status == 1 ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x000000),
                  LV_PART_MAIN | LV_STATE_DEFAULT);
              last_sector_status[i] = status;
            }
            if (delta_ms != last_sector_delta_ms[i]) {
              char text[24];
