                              text_color: 0x000000
                        on_change:
                          then:
                            - lambda: |-
                                static const int values[] = {10, 15, 20, 25, 30};
                                const int index = std::max(0, std::min(4, x));
                                id(fuel_check_interval_min) = values[index];

                                // Se la sessione è già attiva, ricalcola la prossima
                                // scadenza partendo sempre dall'inizio sessione.
                                if (goats_sessions_active() &&
                                    id(fuel_session_start_ms) != 0) {
                                  const uint32_t interval_ms =
                                      static_cast<uint32_t>(
                                        id(fuel_check_interval_min)) * 60000UL;
                                  const uint32_t elapsed =
                                      millis() - id(fuel_session_start_ms);
                                  const uint32_t periods =
                                      elapsed / interval_ms + 1UL;
                                  id(fuel_next_check_ms) =
                                      id(fuel_session_start_ms) +
                                      periods * interval_ms;
                                }

