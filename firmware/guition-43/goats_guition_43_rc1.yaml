# ============================================================
# PARSER NMEA
# ============================================================

interval:
  - interval: 2s
    then:
      - lambda: |-
          if (goats_sd_storage::ready() && goats_sd_storage::writable()) {
            lv_label_set_text(id(lbl_sd_status), "SD OK");
            lv_obj_set_style_text_color(
                id(lbl_sd_status), lv_color_hex(0x00D084),
                LV_PART_MAIN | LV_STATE_DEFAULT);
          } else {
            lv_label_set_text(id(lbl_sd_status), "SD!");
            lv_obj_set_style_text_color(
                id(lbl_sd_status), lv_color_hex(0xD62828),
                LV_PART_MAIN | LV_STATE_DEFAULT);
          }

  # Gestione ricarica automatica.
  - interval: 1s
    then:
      - lambda: |-
          id(charge_action) = 0;
          if (!id(battery_voltage).has_state()) return;

          const uint32_t now = millis();
          const float v = id(battery_voltage).state;

          if (!std::isfinite(id(charge_baseline_v))) {
            id(charge_baseline_v) = v;
            id(charge_peak_v) = v;
            return;
          }

          if (!id(charge_usb_present)) {
            // Mantiene come baseline il valore minimo osservato a batteria.
            // Un aumento >= 80 mV stabile per 3 s identifica il collegamento USB.
            if (v < id(charge_baseline_v))
              id(charge_baseline_v) = v;

            const bool usb_rise =
                v >= 4.03f &&
                (v - id(charge_baseline_v)) >= 0.08f;

            if (usb_rise) {
              if (id(charge_detect_since_ms) == 0)
                id(charge_detect_since_ms) = now;
              if (now - id(charge_detect_since_ms) >= 3000UL) {
                id(charge_usb_present) = true;
                id(charge_usb_detected_ms) = now;
                id(charge_peak_v) = v;
                id(charge_drop_since_ms) = 0;
                id(charge_full_since_ms) = 0;
                id(charge_full_latched) = false;
                id(charge_full_dismissed) = false;
              }
            } else {
              id(charge_detect_since_ms) = 0;
            }
          } else {
            if (!std::isfinite(id(charge_peak_v)) || v > id(charge_peak_v))
              id(charge_peak_v) = v;

            // Scollegamento USB: caduta >= 80 mV dal picco, stabile per 2 s.
            const bool usb_drop =
                std::isfinite(id(charge_peak_v)) &&
                (id(charge_peak_v) - v) >= 0.08f;
            if (usb_drop) {
              if (id(charge_drop_since_ms) == 0)
                id(charge_drop_since_ms) = now;
              if (now - id(charge_drop_since_ms) >= 2000UL) {
                id(charge_usb_present) = false;
                id(charge_baseline_v) = v;
                id(charge_peak_v) = v;
                id(charge_detect_since_ms) = 0;
                id(charge_drop_since_ms) = 0;
                id(charge_full_since_ms) = 0;
                id(charge_full_latched) = false;
                id(charge_full_dismissed) = false;
                if (id(charge_mode_active) || id(charge_full_screen)) {
                  id(charge_mode_active) = false;
                  id(charge_full_screen) = false;
                  id(charge_action) = 2;  // USB rimossa -> riattiva UI
                }
                return;
              }
            } else {
              id(charge_drop_since_ms) = 0;
            }

            // Carica completa: >= 4.34 V per due minuti consecutivi.
            if (!id(charge_full_latched) && v >= 4.34f) {
              if (id(charge_full_since_ms) == 0)
                id(charge_full_since_ms) = now;
              if (now - id(charge_full_since_ms) >= 120000UL)
                id(charge_full_latched) = true;
            } else if (!id(charge_full_latched) && v < 4.30f) {
              id(charge_full_since_ms) = 0;
            }

            uint32_t idle_ref = id(charge_usb_detected_ms);
            const uint32_t usb_activity = goats_usb_activity_v11::last_ms();
            if (usb_activity > idle_ref) idle_ref = usb_activity;
            if (id(charge_manual_resume_ms) > idle_ref)
              idle_ref = id(charge_manual_resume_ms);

            // Dopo 5 minuti senza traffico USB entra in Charge Mode.
            // Non interrompe mai una sessione/laptimer attivi.
            if (!id(charge_mode_active) &&
                !id(charge_full_screen) &&
                !goats_sessions_active() &&
                !goats_sessions_free_active() &&
                !goats_laptimer_running() &&
                now - idle_ref >= 300000UL) {
              id(charge_mode_active) = true;
              id(charge_mode_started_ms) = now;
              id(charge_action) = id(charge_full_latched) &&
                                  !id(charge_full_dismissed) ? 3 : 1;
              return;
            }

            // Un nuovo trasferimento USB riattiva il display solo dalla
            // modalità di carica buia. Non chiude BATTERIA CARICA.
            if (id(charge_mode_active) &&
                !id(charge_full_screen) &&
                usb_activity > id(charge_mode_started_ms)) {
              id(charge_mode_active) = false;
              id(charge_manual_resume_ms) = now;
              id(charge_action) = 2;
              return;
            }

            // Se termina la carica mentre il display è in Charge Mode,
            // riaccende il pannello e lascia la schermata fino a tocco/USB off.
            if (id(charge_mode_active) &&
                !id(charge_full_screen) &&
                id(charge_full_latched) &&
                !id(charge_full_dismissed)) {
              id(charge_full_screen) = true;
              id(charge_action) = 3;
              return;
            }
          }

      - if:
          condition:
            lambda: return id(charge_action) == 1;
          then:
            - light.turn_off: display_backlight

      - if:
          condition:
            lambda: return id(charge_action) == 2;
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 100%
            - lvgl.page.show:
                id: main_page
                animation: NONE

      - if:
          condition:
            lambda: return id(charge_action) == 3;
          then:
            - lambda: |-
                id(charge_full_screen) = true;
            - lvgl.label.update:
                id: charge_full_voltage_label
                text: !lambda |-
                  char b[32];
                  const float v = id(battery_voltage).has_state()
                      ? id(battery_voltage).state : 0.0f;
                  snprintf(b, sizeof(b), "100%%  %.2f V", v);
                  return std::string(b);
            - light.turn_on:
                id: display_backlight
                brightness: 100%
            - lvgl.page.show:
                id: charge_full_page
                animation: NONE


  - interval: 500ms
    then:
      - lambda: |-
           // V1.0.9 TEST: Manager non puo' interrogare o scrivere sul GNSS.
           if (GOATS_USB_TRACKS.take_identity_request()) {
             GOATS_USB_TRACKS.send_identity_result("PASSIVE_RX_ONLY");
           }
           if (GOATS_USB_TRACKS.take_assistnow_apply_request()) {
             GOATS_USB_TRACKS.send_assistnow_apply_error("GNSS_PASSIVE_TEST");
           }
  # V9.2 - STINT + stato SD.
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_stint_time
          text: !lambda |-
            const uint32_t ms = goats_sessions_stint_elapsed_ms(millis());
            const uint32_t total_sec = ms / 1000UL;
            const uint32_t hh = total_sec / 3600UL;
            const uint32_t mm = (total_sec / 60UL) % 60UL;
            const uint32_t ss = total_sec % 60UL;
            char b[28];
            snprintf(
                b, sizeof(b), "STINT %02lu:%02lu:%02lu",
                static_cast<unsigned long>(hh),
                static_cast<unsigned long>(mm),
                static_cast<unsigned long>(ss));
            return std::string(b);
      - lambda: |-
          if (goats_sd_storage::ready()) {
            lv_obj_add_flag(id(lbl_sd_status), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(info_sd_label), "microSD: OK - sessioni su SD");
            lv_obj_set_style_text_color(
                id(info_sd_label), lv_color_hex(0x00D084),
                LV_PART_MAIN | LV_STATE_DEFAULT);
          } else {
            lv_obj_add_flag(id(lbl_sd_status), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(info_sd_label), "microSD: NON RILEVATA");
            lv_obj_set_style_text_color(
                id(info_sd_label), lv_color_hex(0xD62828),
                LV_PART_MAIN | LV_STATE_DEFAULT);
          }

  # Aggiorna elenco e dettaglio delle sessioni persistenti.
  - interval: 700ms
    then:
