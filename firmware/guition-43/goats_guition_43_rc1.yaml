          if (goats_laptimer_consume_lap_completed_event()) {
            if (id(post_lap_mode) == 1) {
              id(post_lap_pending) = true;
              // Come V14: il NEW BEST ha priorita sul normale avviso.
              id(post_lap_show_after_ms) = now + 1500UL;
            } else if (id(post_lap_mode) == 2) {
              id(post_lap_pending) = false;
              id(post_lap_visible) = false;
              id(post_lap_blink_active) = true;
              id(post_lap_blink_until_ms) =
                  now + static_cast<uint32_t>(id(post_lap_duration_sec)) * 1000UL;
              id(post_lap_blink_last_ms) = goats_laptimer_last_lap_ms();
              id(post_lap_blink_delta) = goats_laptimer_post_lap_best_delta_seconds();
            } else {
              id(post_lap_pending) = false;
              id(post_lap_visible) = false;
              id(post_lap_blink_active) = false;
              id(post_lap_show_after_ms) = 0;
              id(post_lap_hide_at_ms) = 0;
              id(post_lap_blink_until_ms) = 0;
            }
          }

          if (id(post_lap_blink_active) &&
              static_cast<int32_t>(now - id(post_lap_blink_until_ms)) >= 0) {
            id(post_lap_blink_active) = false;
            id(post_lap_blink_until_ms) = 0;
