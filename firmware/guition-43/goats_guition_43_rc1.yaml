                          - "20 minuti"
                          - "25 minuti"
                          - "30 minuti"
                        selected_index: !lambda |-
                          switch (id(fuel_check_interval_min)) {
                            case 10: return 0;
                            case 20: return 2;
                            case 25: return 3;
                            case 30: return 4;
                            default: return 1;
                          }
                        dir: BOTTOM
                        text_font: roboto_14
