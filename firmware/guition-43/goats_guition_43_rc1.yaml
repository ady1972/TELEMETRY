    type: int
    restore_value: yes
    initial_value: "15"

  # Schermata post-giro abilitabile/disabilitabile dalle Impostazioni.
  - id: post_lap_enabled
    type: bool
    restore_value: yes
    initial_value: "true"

  # UI19 - Modalita segnalazione giro: 0=OFF, 1=POPUP, 2=LAMPEGGIO.
  - id: post_lap_mode
    type: int
    restore_value: yes
    initial_value: "2"

