# RC1 — base Guition V1.0.22, promozione del 13/11/2026.
# ============================================================
# GOATS RT FIRMWARE - V11.0.2.40 UBX NATIVE GNSS
# Guition 4.3" 480x272 + NEO-M9N UBX 25 Hz
#
# Dashboard definitiva senza libreria circuiti:
# - inizializzazione display e touch
# - lettura UBX-NAV-PVT / NAV-DOP / NAV-SAT dal M9N
# - visualizzazione velocità, fix, satelliti, HDOP e frequenza RMC
#
# Collegamento:
#   TX M9N  -> GPIO17 Guition
#   GND M9N -> GND Guition
#   RX M9N  <- GPIO18 Guition
#
# Il firmware usa anche UBX su GPIO18 per assistenza e power management.
# ============================================================

substitutions:
  device_name: goats-rt-laptimer-v2
  friendly_name: "GOATS GUITION 4.3 V1.0.22 RC1 RLCD26 USB"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: goats_rt.guition43
    version: "1.0.22-rc1"
  includes:
    - goats_guition_43_rc1/goats_version.h
    - goats_guition_43_rc1/goats_diagnostics.h
    - goats_guition_43_rc1/goats_port_types.h
    - goats_guition_43_rc1/goats_lap_journal.h
    - goats_guition_43_rc1/goats_sd_storage.h
    - goats_guition_43_rc1/goats_crash_diag.h
    - goats_guition_43_rc1/goats_usb_activity_v11.h
    - goats_guition_43_rc1/goats_usb_tracks_v1025.h
    - goats_guition_43_rc1/goats_laptimer.h
    - goats_guition_43_rc1/goats_nav_sample_queue.h
    - goats_guition_43_rc1/goats_sessions.h
    - goats_guition_43_rc1/goats_pipeline.h
    - goats_guition_43_rc1/goats_gnss_assist_v1023.h
    - goats_guition_43_rc1/goats_ubx_m9n_v11.h
    - goats_guition_43_rc1/goats_usb_sd_msc.h
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: -100
    then:
      # V10.2.5B - splash/backlight anticipati, sola modifica grafica.
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lambda: |-
          auto call = id(display_backlight).turn_on();
          call.set_brightness(id(display_brightness));
          call.perform();
      - lvgl.bar.update:
          id: boot_progress
          value: 8
      - lambda: |-
          goats_crash_diag::boot_capture();
          goats_tracks_setup();
          goats_laptimer_reset();

          // V9.2 - microSD onboard: CS10 / MOSI11 / SCK12 / MISO13.
          // Le sessioni persistenti vengono caricate esclusivamente dalla SD.
          goats_sessions_setup();

          // V11.0.2.40 - M9N configurato dal firmware a ogni boot:
          // UBX only, 230400 bps, 25 Hz, MAXSVS 32.
          // GNSS PASSIVO: nessuna configurazione inviata al ricevitore.

          // V1.0.9 TEST: avvio GNSS senza assistenza persistita.
          // Il file AssistNow e il backup DBD restano in NVS, ma non vengono
          // iniettati automaticamente: potrebbero essere obsoleti.
          // Il Manager puo' ancora richiedere l'applicazione manuale AssistNow.
          auto saved_assist = goats_gnss_assist::load_assistnow();
          ESP_LOGI("goats_assist", "BOOT SAFE: AssistNow NVS %u bytes, auto-invio disabilitato",
                   (unsigned)saved_assist.size());
          auto saved_dbd = goats_gnss_assist::load_blob();
          ESP_LOGI("goats_assist", "BOOT SAFE: DBD NVS %u bytes, auto-ripristino disabilitato",
                   (unsigned)saved_dbd.size());

          lv_obj_add_flag(id(lbl_sd_status), LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(lbl_sd_status), "SD OK");
          lv_obj_set_style_text_color(id(lbl_sd_status), lv_color_hex(0xF2C94C),
                                      LV_PART_MAIN | LV_STATE_DEFAULT);
      # Barra di avvio puramente temporizzata: circa 3 secondi.
      - delay: 600ms
      - lvgl.bar.update:
          id: boot_progress
          value: 28
      - delay: 600ms
      - lvgl.bar.update:
          id: boot_progress
          value: 50
      - delay: 600ms
      - lvgl.bar.update:
          id: boot_progress
          value: 72
      - delay: 600ms
      - lvgl.bar.update:
          id: boot_progress
          value: 92
      - delay: 500ms
      - lvgl.bar.update:
          id: boot_progress
          value: 100
      - delay: 250ms
      - lvgl.page.show:
          id: main_page
          animation: NONE
      - script.execute: sd_postboot_init

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf
    components:
      - espressif/esp_tinyusb^2.0.1
    sdkconfig_options:
      CONFIG_TINYUSB_MSC_ENABLED: "y"
      CONFIG_TINYUSB_MSC_BUFSIZE: "8192"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: WARN
  baud_rate: 0

# Aggiornamento firmware esclusivamente tramite USB.


# ============================================================
# ============================================================

script:
  - id: sd_postboot_init
    mode: single
    then:
      - delay: 6s
      - wait_until:
          condition:
            lambda: return !goats_laptimer_running() && !goats_sessions_active() && !goats_usb_sd_msc::active() && !GOATS_USB_TRACKS.diagnostics_usb_busy();
          timeout: 120s
      - lambda: |-
          if (goats_laptimer_running() || goats_sessions_active() || goats_usb_sd_msc::active() || GOATS_USB_TRACKS.diagnostics_usb_busy()) return;
          goats_sd_storage::setup();
          if (goats_sd_storage::ready()) {
            // The first goats_sessions_setup() runs before the delayed SD mount.
            // Reload the FATFS archive/meta files now that storage is available.
            goats_sessions_reload_persistent();
          }
          lv_obj_add_flag(id(lbl_sd_status), LV_OBJ_FLAG_HIDDEN);

          const bool mounted = goats_sd_storage::ready();
          const bool writable = goats_sd_storage::writable();

          if (mounted && writable) {
            lv_label_set_text(id(lbl_sd_status), "SD OK");
            lv_obj_set_style_text_color(id(lbl_sd_status), lv_color_hex(0x00D084),
                                        LV_PART_MAIN | LV_STATE_DEFAULT);
          } else {
            lv_label_set_text(id(lbl_sd_status), "SD!");
            lv_obj_set_style_text_color(id(lbl_sd_status), lv_color_hex(0xFF4D4D),
                                        LV_PART_MAIN | LV_STATE_DEFAULT);
          }


  - id: delete_archive_session_deferred
    mode: restart
    then:
      - delay: 350ms
      - lambda: |-
          const int idx = id(pending_archive_delete_index);
          id(pending_archive_delete_index) = -1;
          if (idx >= 0) {
            goats_sessions_delete_display(static_cast<size_t>(idx));
          }

# Pulsante momentaneo esterno - GPIO16 -> pulsante -> GND.
# Solo FINE SESSIONE: tutte le logiche di spegnimento sono rimosse.
binary_sensor:
  - platform: gpio
    id: physical_power_button
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - if:
            condition:
              lambda: return goats_sessions_active();
            then:
              - lvgl.widget.show: end_session_confirm_panel


# ============================================================
# BLUETOOTH LOW ENERGY - MODULO GOATS BLE
# ============================================================

output:
  - platform: ledc
    pin: GPIO1
    id: gpio_backlight_pwm
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    id: display_backlight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

# ============================================================
# TOUCH GT911
# ============================================================

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO4
    scan: true

touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true
    reset_pin: GPIO38
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            auto call = id(display_backlight).turn_on();
            call.set_brightness(id(display_brightness));
            call.perform();

# ============================================================
# DISPLAY QSPI 480x272 - CONFIGURAZIONE DALLO YAML FUNZIONANTE
# ============================================================

spi:
  id: quad_spi
  type: quad
  clk_pin: GPIO47
  data_pins: [GPIO21, GPIO48, GPIO40, GPIO39]

display:
  - platform: mipi_spi
    id: my_display
    model: CUSTOM
    bus_mode: quad
    update_interval: never
    auto_clear_enabled: false
    data_rate: 20MHz
    dimensions:
      width: 480
      height: 272
    cs_pin:
      number: GPIO45
      ignore_strapping_warning: true
    invert_colors: true
    init_sequence:
      - [0xff, 0xa5]
