          const lv_color_t muted = lv_color_hex(0xAAB2BD);

          lv_obj_set_style_bg_color(id(delta_panel), neutral,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_bg_grad_color(id(delta_panel), neutral,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_bg_grad_dir(id(delta_panel), LV_GRAD_DIR_NONE,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_border_color(id(delta_panel), lv_color_hex(0x3A434D),
              LV_PART_MAIN | LV_STATE_DEFAULT);

          lv_color_t time_bg = neutral;
          lv_color_t time_text = white;
          lv_color_t time_title = muted;

          // Solo delta negativo evidenziato; mai rosso/fucsia/giallo.
          if (!isnan(id(lap_delta_seconds)) && id(lap_delta_seconds) < 0.0f) {
            time_bg = green;
            time_text = white;
            time_title = white;
          }

          lv_obj_set_style_bg_color(id(time_delta_panel), time_bg,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_bg_opa(id(time_delta_panel), LV_OPA_COVER,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_text_color(id(lbl_delta), time_text,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_text_color(id(lbl_delta_title), time_title,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_text_color(id(lbl_current_lap), white,
              LV_PART_MAIN | LV_STATE_DEFAULT);

      - lambda: |-
          const lv_color_t neutral = lv_color_hex(0x242A33);
          const lv_color_t green = lv_color_hex(0x00C853);
          const lv_color_t red = lv_color_hex(0xD62828);
          const lv_color_t black = lv_color_hex(0x000000);
          const lv_color_t white = lv_color_hex(0xFFFFFF);
          const lv_color_t muted = lv_color_hex(0xAAB2BD);

          lv_color_t speed_bg = neutral;
          lv_color_t speed_text = white;
          lv_color_t speed_title = muted;
          const float delta_v =
              goats_laptimer_display_speed_delta_kmh(millis());

          if (!isnan(delta_v)) {
            const bool blink_off =
                goats_laptimer_final_hold_active(millis()) &&
                !goats_laptimer_final_blink_on(millis());
            if (!blink_off) {
              if (delta_v > 0.0f) {
                speed_bg = green;      // migliore
                speed_text = black;
                speed_title = black;
              } else if (delta_v < 0.0f) {
                speed_bg = red;        // peggiore
                speed_text = white;
                speed_title = white;
              }
            }
          }

          lv_obj_set_style_bg_color(id(speed_delta_panel), speed_bg,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_bg_opa(id(speed_delta_panel), LV_OPA_COVER,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_border_color(id(speed_delta_panel), speed_bg,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_text_color(id(lbl_speed_delta), speed_text,
              LV_PART_MAIN | LV_STATE_DEFAULT);
          lv_obj_set_style_text_color(id(lbl_speed_delta_title), speed_title,
              LV_PART_MAIN | LV_STATE_DEFAULT);

      - lambda: |-
          // V9.0 - Icona batteria reale.
          if (!id(battery_percent).has_state() ||
              isnan(id(battery_percent).state)) {
            lv_obj_set_width(id(battery_icon_fill), 2);
            lv_obj_set_style_bg_color(
                id(battery_icon_fill), lv_color_hex(0x8F969F),
                LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_color(
                id(battery_icon_outline), lv_color_hex(0x8F969F),
                LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_bg_opa(
                id(battery_icon_fill), LV_OPA_COVER,
                LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_opa(
                id(battery_icon_outline), LV_OPA_COVER,
                LV_PART_MAIN | LV_STATE_DEFAULT);
          } else {
            float percent = id(battery_percent).state;
            if (percent < 0.0f) percent = 0.0f;
            if (percent > 100.0f) percent = 100.0f;

            int fill_width =
                2 + static_cast<int>((percent / 100.0f) * 22.0f);
            if (fill_width < 2) fill_width = 2;
            if (fill_width > 24) fill_width = 24;
            lv_obj_set_width(id(battery_icon_fill), fill_width);

            // TEST12: conferma del livello critico per 5 secondi e isteresi.
            // Evita che un singolo valore ADC anomalo faccia cambiare colore.
            static bool battery_low_confirmed = false;
            static uint32_t battery_low_since_ms = 0;
            const uint32_t battery_now_ms = millis();
            if (percent < 10.0f) {
              if (!battery_low_confirmed) {
                if (battery_low_since_ms == 0) battery_low_since_ms = battery_now_ms;
                if (battery_now_ms - battery_low_since_ms >= 5000UL)
                  battery_low_confirmed = true;
              }
            } else if (percent >= 15.0f) {
              battery_low_confirmed = false;
              battery_low_since_ms = 0;
            } else if (!battery_low_confirmed) {
              battery_low_since_ms = 0;
            }
            lv_color_t battery_color;
            if (battery_low_confirmed)
              battery_color = lv_color_hex(0x2828C6);
            else if (percent < 25.0f)
              battery_color = lv_color_hex(0x00C8E0);
            else
              battery_color = lv_color_hex(0x00C800);

            // TEST12: nessun lampeggio dell’indicatore batteria.
            const bool critical_blink_off = false;

            lv_obj_set_style_bg_opa(
                id(battery_icon_fill),
                critical_blink_off ? LV_OPA_TRANSP : LV_OPA_COVER,
                LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_opa(
                id(battery_icon_outline),
                critical_blink_off ? LV_OPA_40 : LV_OPA_COVER,
                LV_PART_MAIN | LV_STATE_DEFAULT);

            lv_obj_set_style_bg_color(
                id(battery_icon_fill), battery_color,
                LV_PART_MAIN | LV_STATE_DEFAULT);
            lv_obj_set_style_border_color(
                id(battery_icon_outline), battery_color,
                LV_PART_MAIN | LV_STATE_DEFAULT);
          }

      - lvgl.label.update:
          id: lbl_sat
          text: !lambda |-
            char b[12];
            snprintf(b, sizeof(b), "%d", id(gps_satellites));
            return std::string(b);

      - lvgl.label.update:
          id: lbl_hdop
          text: !lambda |-
            char b[12];
            if (id(gps_hdop) > 50.0f) snprintf(b, sizeof(b), "--");
            else snprintf(b, sizeof(b), "%.1f", id(gps_hdop));
            return std::string(b);
      - lvgl.label.update:
          id: lbl_gps_layout8
          text: !lambda |-
            char b[48];
            if (id(gps_hdop) > 50.0f)
              snprintf(b, sizeof(b), "GPS %d/%d H:--", id(gps_satellites), id(gps_visible_satellites));
            else
              snprintf(b, sizeof(b), "GPS %d/%d H:%.1f", id(gps_satellites), id(gps_visible_satellites), id(gps_hdop));
            return std::string(b);
          text_color: !lambda |-
            return id(gps_fix) ? lv_color_hex(0xFFFFFF)
                               : lv_color_hex(0xAAB2BD);


  # DIAG: no new transport; preserve logger baud_rate: 0 and USB protocol.
  - interval: 1s
    then:
      - lambda: |-
          goats_diag_v1021::report_tick(
              goats_laptimer_running() || goats_sessions_active() ||
                  goats_sessions_free_active() || goats_sd_storage::live_open(),
              id(usb_sd_mode_active) || goats_usb_sd_msc::active() ||
                  GOATS_USB_TRACKS.diagnostics_usb_busy());

  # FatFS/NVS work outside the NAV-PVT parser and timing consumer.
  - interval: 10ms
    then:
      - lambda: |-
          if (goats_usb_sd_msc::active() || GOATS_USB_TRACKS.diagnostics_usb_busy()) return;
          // Drain any parser-produced backlog before starting a storage slice.
          goats_sessions_storage_tick();
