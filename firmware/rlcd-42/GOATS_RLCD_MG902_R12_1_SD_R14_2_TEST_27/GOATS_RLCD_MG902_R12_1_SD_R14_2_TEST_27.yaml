# FASE2 R12.1 - LAP TIME in alto, DELTA/BEST/VELOCITA al centro, GPS/AUTO/BAT in basso
# GOATS RLCD V1.5 — FASE 2 R12.1 — GPS GRANDE AUTO CENTRO — 2026-11-02
# GOATS RLCD — TEST C3: V3 GPS intoccato + grafica geometria Layout 8 originale
# MG902: gestione microSD differita al primo fix valido oppure richiesta esplicita del Manager; nessun test di scrittura SD.
# File m9n_passive.h identico alla V3 diagnostica funzionante.
esphome:
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            goats_gpio2_pullup::init();
    - priority: -100
      then:
        - lambda: |-
            if(!goats_usb_msc::boot_if_requested()) {
              goats_b::setup();
              goats_archive::setup();
              goats_menu::init();
              goats_dual_core::start();
            }
  name: goats-rlcd-mg902-test27
  friendly_name: GOATS RLCD MG902 R12.1 SD R14.2 TEST 27
  includes:
    - goats_usb_msc.h
    - goats_session_control.h
    - goats_test_b.h
    - goats_track_types.h
    - goats_laptimer.h
    - goats_racing_bridge.h
    - m9n_passive.h
    - goats_postlap_ui.h
    - goats_session_archive.h
    - goats_sd_storage.h
    - goats_sd_r14_bridge.h
    - goats_dual_core.h
    - goats_gpio2_pullup.h
    - goats_legacy_menu_ui.h
    - goats_gps_trace.h
    - goats_sd_usb_export.h

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    # Espressif TinyUSB abilita le dipendenze FATFS nel build ESPHome.
    # Stessa strategia gia usata nelle build R13.0.7.
    components:
      - espressif/esp_tinyusb^2.0.1
    sdkconfig_options:
      CONFIG_TINYUSB_MSC_ENABLED: "y"
      CONFIG_TINYUSB_MSC_BUFSIZE: "8192"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0  # USB_SERIAL_JTAG reserved for Manager GTRK protocol

external_components:
  - source: github://kylehase/ESPHome-ST7305-RLCD
    components: [st7305_rlcd]

uart:
  - id: gps_uart
    rx_pin: GPIO1
    # TEST C4: UART a 230400 fissi; il M9N deve essere configurato allo stesso baud.
    # TX UART assente: GPIO2 e solo ingresso con pull-up, nessun comando M9N.
    baud_rate: 230400
    rx_buffer_size: 8192

spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

